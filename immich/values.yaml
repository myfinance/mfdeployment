# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

immich:
  replicaCount: 1
  persistence:
    createPvc: true
    librarySize: 500Gi
    dbSize: 10Gi
  db:
    name: immich-db
    pvc: immich-db-pvc
    user: postgres
    database: immich
  redis:
    name: immich-redis
  ml:
    name: immich-ml
  app:
    name: immich
    pvc: immich-pvc
  oauth:
    clientSecret: vulkan
  storageTemplate:
    enabled: true
    template: "{{y}}/{{MM}}/{{dd}}/{{filename}}"
  resources:
    limits:
      cpu: 2000m
      memory: 8Gi
    requests:
      cpu: 200m
      memory: 1Gi
