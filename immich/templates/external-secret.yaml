apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: immich-secrets
  labels:
    app: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.immich.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: immich-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.immich.externalSecret.vaultKey | default "apps/immich" }}
        property: POSTGRES_PASSWORD
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.immich.externalSecret.vaultKey | default "apps/immich" }}
        property: DB_PASSWORD
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.immich.externalSecret.vaultKey | default "apps/immich" }}
        property: OAUTH_CLIENT_SECRET
    - secretKey: NC_PASSWORD
      remoteRef:
        key: apps/nextcloud
        property: NEXTCLOUD_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: immich-config
  labels:
    app: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.immich.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.immich.app.name }}-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        immich.json: |
          {
            "storageTemplate": {
              "enabled": {{ .Values.immich.storageTemplate.enabled | default true }},
              "template": {{ .Values.immich.storageTemplate.template | default "{{y}}/{{MM}}/{{dd}}/{{filename}}" | quote }}
            },
            "oauth": {
              "enabled": true,
              "issuerUrl": "https://keycloak.hfischer.org/realms/home",
              "clientId": "immich",
              "clientSecret": "{{"{{"}} .OAUTH_CLIENT_SECRET {{"}}"}}",
              "autoRegister": true,
              "buttonText": "Login with Keycloak"
            }
          }
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.immich.externalSecret.vaultKey | default "apps/immich" }}
        property: OAUTH_CLIENT_SECRET
