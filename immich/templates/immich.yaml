apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.immich.app.pvc }}
  labels:
    app: {{ .Values.immich.app.name }}
spec:
  storageClassName: {{ .Values.immich.persistence.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.immich.persistence.librarySize }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.immich.app.name }}
  labels:
    app: {{ .Values.immich.app.name }}
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.immich.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.immich.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.immich.app.name }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      enableServiceLinks: false
      containers:
        - name: server
          image: {{ .Values.immich.image }}
          env:
            - name: DB_HOSTNAME
              value: "{{ .Values.immich.db.name }}"
            - name: DB_USERNAME
              value: "{{ .Values.immich.db.user }}"
            - name: DB_PASSWORD
              value: "{{ .Values.immich.db.pw }}"
            - name: DB_DATABASE_NAME
              value: "{{ .Values.immich.db.database }}"
            - name: REDIS_HOSTNAME
              value: "{{ .Values.immich.redis.name }}"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://{{ .Values.immich.ml.name }}:3003"
            - name: IMMICH_CONFIG_FILE
              value: "/etc/immich/immich.json"
            - name: TZ
              value: Europe/Berlin
          ports:
            - containerPort: 2283
              name: httpport
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: library
              mountPath: /data
            - name: config
              mountPath: /etc/immich/immich.json
              subPath: immich.json
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: {{ .Values.immich.app.pvc }}
        - name: config
          configMap:
            name: {{ .Values.immich.app.name }}-config

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.immich.app.name }}
  labels:
    app: {{ .Values.immich.app.name }}
spec:
  ports:
    - port: 2283
      targetPort: 2283
  selector:
    app: {{ .Values.immich.app.name }}

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.immich.app.name }}
  labels:
    app: {{ .Values.immich.app.name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: "pics.{{ .Values.master_ip }}.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.immich.app.name }}
                port:
                  number: 2283

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.immich.app.name }}-secure
  labels:
    app: {{ .Values.immich.app.name }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pics.hfischer.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{ .Values.immich.app.name }}
          port: 2283
  tls:
    certResolver: default
