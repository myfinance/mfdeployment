apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-secrets
  labels:
    app: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.nextcloud.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: nextcloud-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.nextcloud.externalSecret.vaultKey | default "apps/nextcloud" }}
        property: POSTGRES_PASSWORD
    - secretKey: NEXTCLOUD_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.nextcloud.externalSecret.vaultKey | default "apps/nextcloud" }}
        property: NEXTCLOUD_ADMIN_PASSWORD
