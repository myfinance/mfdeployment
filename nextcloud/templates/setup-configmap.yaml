apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nextcloud.app.name }}-setup-script
  labels:
    app: {{ .Values.nextcloud.app.name }}
data:
  setup-nextcloud.sh: |
    #!/bin/sh
    echo "Starting Nextcloud automatic configuration hook..."

    # Allow Nextcloud to make backend requests to local network hosts (e.g. keycloak.hfischer.org)
    php /var/www/html/occ config:system:set allow_local_remote_servers --value=true --type=boolean

    # Set maintenance window start time to 01:00 UTC (02:00 CET)
    php /var/www/html/occ config:system:set maintenance_window_start --value=1 --type=integer

    # 1. Install/enable user_oidc app if not installed
    if ! php /var/www/html/occ app:list | grep -q "user_oidc:"; then
      echo "Installing user_oidc app..."
      php /var/www/html/occ app:install user_oidc
    fi

    # 2. Install/enable groupfolders app if not installed
    if ! php /var/www/html/occ app:list | grep -q "groupfolders:"; then
      echo "Installing groupfolders app..."
      php /var/www/html/occ app:install groupfolders
    fi

    # 3. Install/enable richdocuments (Collabora Online) app if not installed
    if ! php /var/www/html/occ app:list | grep -q "richdocuments:"; then
      echo "Installing richdocuments app..."
      php /var/www/html/occ app:install richdocuments
    fi

    # Configure Collabora Online wopi_url
    echo "Configuring richdocuments wopi_url..."
    php /var/www/html/occ config:app:set richdocuments wopi_url --value="https://office.hfischer.org"

    # Activate Collabora Online configuration and fetch discovery XML
    echo "Activating richdocuments configuration..."
    php /var/www/html/occ richdocuments:activate-config || true

    # 4. Register OIDC provider if not registered, or update it
    if ! php /var/www/html/occ user_oidc:provider | grep -q "keycloak"; then
      echo "Registering OIDC provider keycloak..."
      php /var/www/html/occ user_oidc:provider keycloak \
        --clientid="nextcloud" \
        --clientsecret="vulkan" \
        --discoveryuri="https://keycloak.hfischer.org/realms/home/.well-known/openid-configuration" \
        --mapping-groups="groups" \
        --group-provisioning=1 \
        --group-whitelist-regex="^(?!admin$).+$"
    else
      echo "Updating OIDC provider keycloak configuration..."
      php /var/www/html/occ user_oidc:provider keycloak \
        --clientid="nextcloud" \
        --clientsecret="vulkan" \
        --discoveryuri="https://keycloak.hfischer.org/realms/home/.well-known/openid-configuration" \
        --mapping-groups="groups" \
        --group-provisioning=1 \
        --group-whitelist-regex="^(?!admin$).+$"
    fi

    # Pre-create Nextcloud groups so they can be assigned to group folders
    create_group_if_not_exists() {
      local name="$1"
      if ! php /var/www/html/occ group:list | grep -q "  - $name:"; then
        echo "Creating Nextcloud group: $name" >&2
        php /var/www/html/occ group:add "$name" || true
      fi
    }

    create_group_if_not_exists "nextcloud-users"

    # 6. function to Create Group Folders and assign groups/permissions used below
    get_or_create_folder() {
      local name="$1"
      local folder_id=$(php /var/www/html/occ groupfolders:list | awk -F'|' -v name="$name" '{gsub(/[ \t]+/, "", $2); gsub(/[ \t]+/, "", $3); if ($3 == name) print $2}')
      if [ -z "$folder_id" ]; then
        echo "Creating group folder: $name" >&2
        local output=$(php /var/www/html/occ groupfolders:create "$name")
        folder_id=$(echo "$output" | tr -dc '0-9')
      fi
      echo "$folder_id"
    }

    # Deterministic SHA-256 hashes generated by Nextcloud's user_oidc provider mapping (sha256("1_0_" + group_name)):
    OIDC_USERS="42485d2fdbe50bc5ac6d7b29d3b979c3b7e17e0c78154287fa996821c47ffa70"
    OIDC_FAMILYADMIN="498af0029a55e578aed181118f61701c18837fc325418a527f7ad18bc9c23ffd"
    OIDC_USER_HOLGER="50761e04e717830ff6a3752e4efdc97629af502246cc8cbf6876bd87bef65c11"
    OIDC_USER_DOERTE="d7cc882c9ea3f2be8f416adfcd8994b259fb1c8516aa4e3cc16eb91fcccfe718"
    OIDC_USER_JONAS="389344b18c60374e78fa24825108d0e2302d9bc54057d35cc19b5654462ce9b8"
    OIDC_USER_PAUL="e473dae78e30d08d35560b8801d149e1d4045367afd96bbf333a6ff8c4d763d2"

    # Pre-create OIDC groups in Nextcloud so they can be assigned even before first user login
    create_group_if_not_exists "$OIDC_USER_HOLGER"
    create_group_if_not_exists "$OIDC_USER_DOERTE"
    create_group_if_not_exists "$OIDC_USER_JONAS"
    create_group_if_not_exists "$OIDC_USER_PAUL"

    # Folder 1: familyshare (all users have read/write access)
    share_id=$(get_or_create_folder "familyshare")
    php /var/www/html/occ groupfolders:group "$share_id" "$OIDC_USERS" || true
    php /var/www/html/occ groupfolders:group "$share_id" "$OIDC_USERS" write share delete || true
    php /var/www/html/occ groupfolders:group "$share_id" "admin" || true
    php /var/www/html/occ groupfolders:group "$share_id" "admin" write share delete || true

    # Folder 2: data (users have read-only, admin has read/write)
    data_id=$(get_or_create_folder "data")
    php /var/www/html/occ groupfolders:group "$data_id" "$OIDC_USERS" || true
    php /var/www/html/occ groupfolders:group "$data_id" "$OIDC_FAMILYADMIN" || true
    php /var/www/html/occ groupfolders:group "$data_id" "$OIDC_FAMILYADMIN" write share delete || true
    php /var/www/html/occ groupfolders:group "$data_id" "admin" || true
    php /var/www/html/occ groupfolders:group "$data_id" "admin" write share delete || true

    # Folder 3: backup (only holger and admin have full access; remove OIDC_USERS if present)
    backup_id=$(get_or_create_folder "backup")
    php /var/www/html/occ groupfolders:group "$backup_id" "$OIDC_USERS" --delete || true
    php /var/www/html/occ groupfolders:group "$backup_id" "$OIDC_FAMILYADMIN" || true
    php /var/www/html/occ groupfolders:group "$backup_id" "$OIDC_FAMILYADMIN" write share delete || true
    php /var/www/html/occ groupfolders:group "$backup_id" "admin" || true
    php /var/www/html/occ groupfolders:group "$backup_id" "admin" write share delete || true

    # Folder 4: doerteholgershare (only holger, doerte and admin have full access)
    doerteholger_id=$(get_or_create_folder "doerteholgershare")
    php /var/www/html/occ groupfolders:group "$doerteholger_id" "$OIDC_USER_HOLGER" || true
    php /var/www/html/occ groupfolders:group "$doerteholger_id" "$OIDC_USER_HOLGER" write share delete || true
    php /var/www/html/occ groupfolders:group "$doerteholger_id" "$OIDC_USER_DOERTE" || true
    php /var/www/html/occ groupfolders:group "$doerteholger_id" "$OIDC_USER_DOERTE" write share delete || true
    php /var/www/html/occ groupfolders:group "$doerteholger_id" "admin" || true
    php /var/www/html/occ groupfolders:group "$doerteholger_id" "admin" write share delete || true

    # Folder 5: jonasshare (full access for doerte, holger, jonas and admin)
    jonas_id=$(get_or_create_folder "jonasshare")
    php /var/www/html/occ groupfolders:group "$jonas_id" "$OIDC_USER_HOLGER" || true
    php /var/www/html/occ groupfolders:group "$jonas_id" "$OIDC_USER_HOLGER" write share delete || true
    php /var/www/html/occ groupfolders:group "$jonas_id" "$OIDC_USER_DOERTE" || true
    php /var/www/html/occ groupfolders:group "$jonas_id" "$OIDC_USER_DOERTE" write share delete || true
    php /var/www/html/occ groupfolders:group "$jonas_id" "$OIDC_USER_JONAS" || true
    php /var/www/html/occ groupfolders:group "$jonas_id" "$OIDC_USER_JONAS" write share delete || true
    php /var/www/html/occ groupfolders:group "$jonas_id" "admin" || true
    php /var/www/html/occ groupfolders:group "$jonas_id" "admin" write share delete || true

    # Folder 6: paulshare (full access for doerte, holger, paul and admin)
    paul_id=$(get_or_create_folder "paulshare")
    php /var/www/html/occ groupfolders:group "$paul_id" "$OIDC_USER_HOLGER" || true
    php /var/www/html/occ groupfolders:group "$paul_id" "$OIDC_USER_HOLGER" write share delete || true
    php /var/www/html/occ groupfolders:group "$paul_id" "$OIDC_USER_DOERTE" || true
    php /var/www/html/occ groupfolders:group "$paul_id" "$OIDC_USER_DOERTE" write share delete || true
    php /var/www/html/occ groupfolders:group "$paul_id" "$OIDC_USER_PAUL" || true
    php /var/www/html/occ groupfolders:group "$paul_id" "$OIDC_USER_PAUL" write share delete || true
    php /var/www/html/occ groupfolders:group "$paul_id" "admin" || true
    php /var/www/html/occ groupfolders:group "$paul_id" "admin" write share delete || true

    # Add any missing database indices
    php /var/www/html/occ db:add-missing-indices || true

    echo "Nextcloud automatic configuration hook completed successfully!"
