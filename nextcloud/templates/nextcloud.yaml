{{- if .Values.nextcloud.persistence.createPvc | default true }}
{{- if .Values.nextcloud.persistence.dbVolumeName }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.nextcloud.persistence.dbVolumeName }}
spec:
  capacity:
    storage: {{ .Values.nextcloud.persistence.dbSize }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.nextcloud.persistence.storageClassName }}
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: {{ .Values.nextcloud.persistence.dbVolumeName }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ .Values.nextcloud.db.pvc }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.nextcloud.db.pvc }}
  labels:
    app: {{ .Values.nextcloud.db.name }}
spec:
  storageClassName: {{ .Values.nextcloud.persistence.storageClassName }}
  {{- if .Values.nextcloud.persistence.dbVolumeName }}
  volumeName: {{ .Values.nextcloud.persistence.dbVolumeName }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nextcloud.persistence.dbSize }}

---
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nextcloud.db.name }}
  labels:
    app: {{ .Values.nextcloud.db.name }}
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.nextcloud.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.nextcloud.db.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.nextcloud.db.name }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.nextcloud.pgimage }}
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.nextcloud.db.database }}"
            - name: POSTGRES_USER
              value: "{{ .Values.nextcloud.db.user }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.nextcloud.db.pw }}"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: dbport
          resources:
            limits:
              cpu: 300m
              memory: 500Mi
            requests:
              cpu: 50m
              memory: 100Mi
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ .Values.nextcloud.db.pvc }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nextcloud.db.name }}
  labels:
    app: {{ .Values.nextcloud.db.name }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: {{ .Values.nextcloud.db.name }}

---

{{- if .Values.nextcloud.persistence.createPvc | default true }}
{{- if .Values.nextcloud.persistence.volumeName }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.nextcloud.persistence.volumeName }}
spec:
  capacity:
    storage: {{ .Values.nextcloud.persistence.nextcloudSize }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.nextcloud.persistence.storageClassName }}
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: {{ .Values.nextcloud.persistence.volumeName }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ .Values.nextcloud.app.pvc }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.nextcloud.app.pvc }}
  labels:
    app: {{ .Values.nextcloud.app.name }}
spec:
  storageClassName: {{ .Values.nextcloud.persistence.storageClassName }}
  {{- if .Values.nextcloud.persistence.volumeName }}
  volumeName: {{ .Values.nextcloud.persistence.volumeName }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nextcloud.persistence.nextcloudSize }}

---
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nextcloud.app.name }}
  labels:
    app: {{ .Values.nextcloud.app.name }}
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.nextcloud.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.nextcloud.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.nextcloud.app.name }}
    spec:
      securityContext:
        fsGroup: 33
      containers:
        - name: nextcloud
          image: {{ .Values.nextcloud.image }}
          env:
            - name: POSTGRES_HOST
              value: "{{ .Values.nextcloud.db.name }}"
            - name: POSTGRES_DB
              value: "{{ .Values.nextcloud.db.database }}"
            - name: POSTGRES_USER
              value: "{{ .Values.nextcloud.db.user }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.nextcloud.db.pw }}"
            - name: NEXTCLOUD_ADMIN_USER
              value: "{{ .Values.nextcloud.app.adminUser }}"
            - name: NEXTCLOUD_ADMIN_PASSWORD
              value: "{{ .Values.nextcloud.app.adminPw }}"
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "nextcloud.{{ .Values.master_ip }}.nip.io nextcloud.nextcloud.svc.cluster.local nextcloud.hfischer.org"
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16 192.168.100.0/24 10.43.0.0/16"
            - name: OVERWRITEPROTOCOL
              value: "https"
            - name: OVERWRITECLIURL
              value: "https://nextcloud.hfischer.org"
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html
            - name: setup-script
              mountPath: /docker-entrypoint-hooks.d/before-starting/setup-nextcloud.sh
              subPath: setup-nextcloud.sh
      volumes:
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: {{ .Values.nextcloud.app.pvc }}
        - name: setup-script
          configMap:
            name: {{ .Values.nextcloud.app.name }}-setup-script
            defaultMode: 0755

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nextcloud.app.name }}
  labels:
    app: {{ .Values.nextcloud.app.name }}
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: {{ .Values.nextcloud.app.name }}

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.nextcloud.app.name }}
  labels:
    app: {{ .Values.nextcloud.app.name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: "nextcloud.{{ .Values.master_ip }}.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.nextcloud.app.name }}
                port:
                  number: 80

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.nextcloud.app.name }}-secure
  labels:
    app: {{ .Values.nextcloud.app.name }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nextcloud.hfischer.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{ .Values.nextcloud.app.name }}
          port: 80
  tls:
    certResolver: default

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora-code
  labels:
    app: collabora-code
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.nextcloud.replicaCount }}
  selector:
    matchLabels:
      app: collabora-code
  template:
    metadata:
      labels:
        app: collabora-code
    spec:
      containers:
        - name: code
          image: {{ .Values.nextcloud.collaboraImage | default "collabora/code:latest" }}
          args:
            - "--o:ssl.enable=false"
            - "--o:ssl.termination=true"
          env:
            - name: aliasgroup1
              value: "https://nextcloud.hfischer.org:443"
            - name: aliasgroup2
              value: "https://nextcloud.{{ .Values.master_ip }}.nip.io:443"
          ports:
            - containerPort: 9980
              name: codeport
          resources:
            limits:
              cpu: 1000m
              memory: 1.5Gi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN

---

apiVersion: v1
kind: Service
metadata:
  name: collabora-code
  labels:
    app: collabora-code
spec:
  ports:
    - port: 9980
      targetPort: 9980
      name: codeport
  selector:
    app: collabora-code

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabora-code
  labels:
    app: collabora-code
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: "office.{{ .Values.master_ip }}.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collabora-code
                port:
                  number: 9980

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collabora-code-secure
  labels:
    app: collabora-code
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`office.hfischer.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: collabora-code
          port: 9980
  tls:
    certResolver: default


