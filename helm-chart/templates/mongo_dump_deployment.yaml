
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mfdump
spec:
  schedule: "{{ .Values.mfmongo.dumpschedule }}"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: {{ .Values.mfmongo.db_name }}-dump
              image: "{{ .Values.mfmongo.image }}"
              command: ["mongodump", "--host", "mongodb", "--out", "/backup"]
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: {{ .Values.stage }}-{{ .Values.mfmongo.backup_pvc }}
      backoffLimit: 4

