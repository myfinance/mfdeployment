apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mfmongo.db_name }}
spec:
  #this defines which pod is going to be presented by this service
  selector:
    app: {{ .Values.mfmongo.db_name }}
  ports:
    - name: {{ .Values.mfmongo.db_name }}
      port: {{ .Values.mfmongo.db_port }}
      targetPort: {{ .Values.mfmongo.db_port }}
  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: IngressRouteTCP
metadata:
  name: mfmongo{{ .Values.stage }}
spec:
  entryPoints:
    - mongo
    routes:
    - match: HostSNI(`*`)
      services:
        - name: {{ .Values.mfmongo.db_name }}
          port: {{ .Values.mfmongo.db_port }}


