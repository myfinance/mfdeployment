apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mfmarketdata.mf_name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.mfmarketdata.mf_name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mfmarketdata.mf_name }}
    spec:
      containers:
        - name: {{ .Values.mfmarketdata.mf_name }}
          image: "{{ .Values.image.repository }}mfmarketdata:{{ .Values.mfmarketdata.imageversion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          tty: true
          env:
            - name: "server.host"
              value: "{{ .Values.k8_ip }}"
            - name: "env.host"
              value: "{{ .Values.k8_ip }}"
            - name: "spring.data.mongodb.host"
              value: "{{ .Values.mfmongo.db_name }}"
            - name: "spring.data.mongodb.port"
              value: "{{ .Values.mfmongo.db_port }}"
            - name: "api.common.version"
              value: "{{ .Values.mfmarketdata.imageversion }}"
            - name: "spring.rabbitmq.host"
              value: "{{ .Values.mfrabbitmq.name }}"
            - name: "spring.rabbitmq.port"
              value: "{{ .Values.mfrabbitmq.port }}"
            - name: "server.port"
              value: "{{ .Values.mfmarketdata.mf_http_port }}"              
