apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mfmongo.db_name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.mfmongo.db_name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mfmongo.db_name }}
    spec:
      containers:
        - name: {{ .Values.mfmongo.db_name }}
          image: "{{ .Values.mfmongo.image }}"
          imagePullPolicy: IfNotPresent
          args:
            - --wiredTigerCacheSizeGB
            - "0.25"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mfmongo.db_port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          volumeMounts:
            - name: myfinancedata
              mountPath: /data/db
            - name: backup-volume
              mountPath: /backup
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "{{ .Values.mfmongo.db_pw }}"
      volumes:
        - name: myfinancedata
          persistentVolumeClaim:
            claimName: {{ .Values.stage }}-{{ .Values.mfmongo.pvc }}
        - name: backup-volume
          persistentVolumeClaim:
            claimName: {{ .Values.stage }}-{{ .Values.mfmongo.backup_pvc }}            