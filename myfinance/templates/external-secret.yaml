apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myfinance-secrets
  labels:
    app: myfinance
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.mfmongo.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: myfinance-secrets
    creationPolicy: Owner
  data:
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.mfmongo.externalSecret.vaultKey | default "apps/myfinance" }}
        property: MONGO_INITDB_ROOT_PASSWORD
    - secretKey: NEXTCLOUD_PASSWORD
      remoteRef:
        key: {{ .Values.mfmongo.externalSecret.vaultKey | default "apps/myfinance" }}
        property: NEXTCLOUD_PASSWORD
