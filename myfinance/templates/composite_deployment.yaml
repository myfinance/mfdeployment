apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mfcomposite.mf_name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.mfcomposite.mf_name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mfcomposite.mf_name }}
    spec:
      containers:
        - name: {{ .Values.mfcomposite.mf_name }}
          image: "{{ .Values.image.repository }}mfframework:{{ .Values.mfframework.imageversion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}      
          tty: true
          env:
            - name: "server.port"
              value: "{{ .Values.mfcomposite.mf_http_port }}"
            - name: "api.common.version"
              value: "{{ .Values.mfframework.imageversion }}"
            - name: "spring.rabbitmq.host"
              value: "{{ .Values.mfrabbitmq.name }}"
            - name: "spring.rabbitmq.port"
              value: "{{ .Values.mfrabbitmq.port }}"
            - name: "app.mfinstruments.host"
              value: "{{ .Values.mfinstruments.mf_name }}"
            - name: "app.mfinstruments.port"
              value: "{{ .Values.mfinstruments.mf_http_port }}"
            - name: "app.mftransactions.host"
              value: "{{ .Values.mftransactions.mf_name }}"
            - name: "app.mftransactions.port"
              value: "{{ .Values.mftransactions.mf_http_port }}"
            - name: "app.mfmarketdata.host"
              value: "{{ .Values.mfmarketdata.mf_name }}"
            - name: "app.mfmarketdata.port"
              value: "{{ .Values.mfmarketdata.mf_http_port }}"
            - name: "app.mfvaluation.host"
              value: "{{ .Values.mfvaluation.mf_name }}"
            - name: "app.mfvaluation.port"
              value: "{{ .Values.mfvaluation.mf_http_port }}"
            - name: "app.mfsecuritymetrics.host"
              value: "{{ .Values.mfsecuritymetrics.mf_name }}"
            - name: "app.mfsecuritymetrics.port"
              value: "{{ .Values.mfsecuritymetrics.mf_http_port }}"
            # The issuer-uri must match the external URL because the client token's "iss" claim is issued with this hostname.
            - name: "spring.security.oauth2.resourceserver.jwt.issuer-uri"
              value: "http://keycloak.{{ .Values.master_ip }}.nip.io/realms/myfinance"
            # The jwk-set-uri uses the internal cluster DNS name to avoid hairpin NAT issues and improve key-fetch speed.
            - name: "spring.security.oauth2.resourceserver.jwt.jwk-set-uri"
              value: "http://keycloak.keycloak:8080/realms/myfinance/protocol/openid-connect/certs"
