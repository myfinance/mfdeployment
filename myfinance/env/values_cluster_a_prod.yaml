master_ip: 192.168.100.81
image:
  repository: nexus.192.168.100.81.nip.io:31003/repository/mydockerrepo/
stage: prod
mfrabbitmq:
  user: user
  pw: vulkan
  adminname: mfrabbitmqadmin
  storageClassName: longhorn-ssd

mfshell:
  enabled: true
  importtimeseriesweeklyschedule: "1 22 * * 1,2,3,4,5"
  importsecuritymetricsschedule: "1 22 * * 6,0"
  importprevcloseschedule: "1 10 * * *"
  processtransactionschedule: "1 23 * * *"

mfmongo:
  createPvc: true
  volumeName: pvc-4b773b66-1bde-4e0d-9afa-2fd94d173fa7
  db_pw: vulkan
  backupenabled: true
  backuptarget: data/prodclustera
  storageClassName: longhorn-ssd
  backupStorageClassName: longhorn-ssd
  dumpschedule: "1 22 * * 0"
  nextcloud:
    url: "http://nextcloud.nextcloud.svc.cluster.local"
    user: "admin"
    password: "vulkan"
keycloak:
  issuerUri: "https://keycloak.hfischer.org/realms/myfinance"

ingressRoute:
  enabled: true
  host: "myfinance.hfischer.org"

mffrontend:
  config: |
    {
      "zones": [
        {
          "name": "Prod",
          "identifier": "prod",
          "backendurl": "https://myfinance.hfischer.org",
          "openidurl": "https://keycloak.hfischer.org",
          "logstreamurl": "wss://myfinance.hfischer.org/ws/logs"
        }
      ],
      "defaultZone": "prod"
    }

