master_ip: 192.168.100.81
image:
  #repository: nexus.192.168.100.81.nip.io/repository/mydockerrepo/
  repository: repository/mydockerrepo/
stage: test
mfrabbitmq:
  user: user
  pw: vulkan
  port_ext: 30121
  adminname: mfrabbitmqadmin
  adminport_ext: 30122
  storageClassName: longhorn-ssd

mfshell:
    # ┌───────────── minute (0 - 59)
    # │ ┌───────────── hour (0 - 23)
    # │ │ ┌───────────── day of month (1 - 31)
    # │ │ │ ┌───────────── month (1 - 12)
    # │ │ │ │ ┌───────────── day of week (0 - 6) (Sunday to Saturday;
    # │ │ │ │ │                                       7 is also Sunday on some systems)
    # │ │ │ │ │
    # │ │ │ │ │
  # * * * * *  command to execute
  importtimeseriesweeklyschedule: "1 22 * * 1,2,3,4,5"
  importsecuritymetricsschedule: "1 22 * * 6,0"
  importprevcloseschedule: "1 10 * * *"
  processtransactionschedule: "1 23 * * *"

mfmongo:
  db_pw: vulkan
  db_port_ext: 30123
  storageClassName: longhorn-ssd
  backupStorageClassName: longhorn-ssd
    # ┌───────────── minute (0 - 59)
    # │ ┌───────────── hour (0 - 23)
    # │ │ ┌───────────── day of month (1 - 31)
    # │ │ │ ┌───────────── month (1 - 12)
    # │ │ │ │ ┌───────────── day of week (0 - 6) (Sunday to Saturday;
    # │ │ │ │ │                                       7 is also Sunday on some systems)
    # │ │ │ │ │
    # │ │ │ │ │
  # * * * * *  command to execute
  dumpschedule: "1 22 * * 0" 