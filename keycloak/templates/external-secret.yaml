apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  labels:
    app: {{ .Values.keycloak.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.keycloak.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.keycloak.externalSecret.vaultKey | default "apps/keycloak" }}
        property: KEYCLOAK_ADMIN_PASSWORD
