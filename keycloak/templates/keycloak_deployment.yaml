apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.keycloak.name }}
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.keycloak.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.keycloak.name }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: {{ .Values.keycloak.name }}
          image: "{{ .Values.keycloak.image }}"
          imagePullPolicy: IfNotPresent
          args: ["start-dev"]
          volumeMounts:
            - name: keycloakdata
              mountPath: /opt/keycloak/data/h2
          env:
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "{{ .Values.keycloak.pw }}"
      volumes:
        - name: keycloakdata
          persistentVolumeClaim:
            claimName: {{ .Values.keycloak.pvc }}