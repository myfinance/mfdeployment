master_ip: 192.168.100.81

openbao:
  enabled: true
  replicaCount: 1
  image: quay.io/openbao/openbao:2.7.2
  persistence:
    createPvc: true
    storageClassName: longhorn-ssd
    size: 1Gi
  service:
    port: 8200
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
