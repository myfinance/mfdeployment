{{- if .Values.openbao.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-ingress
  labels:
    app: openbao
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: "openbao.{{ .Values.master_ip }}.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao
                port:
                  number: {{ .Values.openbao.service.port }}
{{- end }}
