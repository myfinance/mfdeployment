{{- if .Values.openbao.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  labels:
    app: openbao
data:
  openbao.hcl: |
    ui = true
    disable_mlock = true

    storage "file" {
      path = "/openbao/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }
{{- end }}
