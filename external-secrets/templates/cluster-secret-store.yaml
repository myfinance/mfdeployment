{{- if .Values.clusterSecretStore.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: {{ .Values.clusterSecretStore.vaultServer | quote }}
      path: {{ .Values.clusterSecretStore.vaultPath | quote }}
      version: {{ .Values.clusterSecretStore.vaultVersion | quote }}
      auth:
        {{- if eq .Values.clusterSecretStore.authType "kubernetes" }}
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
        {{- else }}
        tokenSecretRef:
          name: {{ .Values.clusterSecretStore.tokenSecretName }}
          namespace: external-secrets
          key: token
        {{- end }}
{{- end }}
