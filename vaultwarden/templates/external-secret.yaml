{{- if .Values.vaultwarden.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultwarden-secrets
  labels:
    app: {{ .Values.vaultwarden.app.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.vaultwarden.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: vaultwarden-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: {{ .Values.vaultwarden.externalSecret.vaultKey | default "apps/vaultwarden" }}
        property: ADMIN_TOKEN
    - secretKey: NC_PASSWORD
      remoteRef:
        key: apps/nextcloud
        property: NEXTCLOUD_ADMIN_PASSWORD
{{- end }}
