{{- if .Values.vaultwarden.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.vaultwarden.app.name }}
  labels:
    app: {{ .Values.vaultwarden.app.name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-internal-only-allowlist@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: "pass.{{ .Values.master_ip }}.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.vaultwarden.app.name }}
                port:
                  number: 80

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.vaultwarden.app.name }}-secure
  labels:
    app: {{ .Values.vaultwarden.app.name }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.vaultwarden.ingress.host }}`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: internal-only-allowlist
      services:
        - name: {{ .Values.vaultwarden.app.name }}
          port: 80
  tls:
    certResolver: default
{{- end }}
