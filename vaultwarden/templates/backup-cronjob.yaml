{{- if .Values.vaultwarden.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  labels:
    app: vaultwarden-backup
spec:
  schedule: {{ .Values.vaultwarden.backup.schedule | default "0 3 * * *" | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                    - key: app
                      operator: In
                      values:
                      - {{ .Values.vaultwarden.app.name }}
                  topologyKey: "kubernetes.io/hostname"
          containers:
          - name: backup
            image: alpine:3.20
            command:
            - sh
            - -c
            - |
              set -e
              set -o pipefail
              apk add --no-cache sqlite curl gzip

              TARGET_DIR="backup/vaultwarden"
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="/tmp/vaultwarden_backup_${TIMESTAMP}.sqlite3"
              GZ_FILE="${BACKUP_FILE}.gz"

              echo "Creating SQLite backup of Vaultwarden database..."
              if [ ! -f /data/db.sqlite3 ]; then
                echo "Notice: /data/db.sqlite3 does not exist yet. Nothing to back up."
                exit 0
              fi

              sqlite3 "file:/data/db.sqlite3?mode=ro" ".backup '${BACKUP_FILE}'"
              gzip "${BACKUP_FILE}"

              echo "Ensuring Nextcloud backup directory exists..."
              curl -s -k -u "${NC_USER}:${NC_PASSWORD}" -X MKCOL "${NC_URL}/remote.php/dav/files/${NC_USER}/${TARGET_DIR}" || true

              echo "Uploading ${GZ_FILE} to Nextcloud..."
              curl -s -f -k -u "${NC_USER}:${NC_PASSWORD}" -T "${GZ_FILE}" "${NC_URL}/remote.php/dav/files/${NC_USER}/${TARGET_DIR}/vaultwarden_db_${TIMESTAMP}.sqlite3.gz"
              rm -f "${GZ_FILE}"
              echo "Vaultwarden backup upload completed."

              KEEP={{ .Values.vaultwarden.backup.retentionCount | default 14 }}
              echo "Retaining the latest ${KEEP} backups in Nextcloud..."
              REMOTE_FILES=$(curl -s -k -u "${NC_USER}:${NC_PASSWORD}" -X PROPFIND -H "Depth: 1" "${NC_URL}/remote.php/dav/files/${NC_USER}/${TARGET_DIR}/" | \
                grep -o '<d:href>[^<]*</d:href>' | sed 's/<[^>]*>//g' | grep 'vaultwarden_db_.*\.sqlite3\.gz' | sort)

              TOTAL=$(echo "${REMOTE_FILES}" | grep -c 'vaultwarden_db_' || true)
              if [ "${TOTAL}" -gt "${KEEP}" ]; then
                DELETE_COUNT=$((TOTAL - KEEP))
                echo "Found ${TOTAL} backups, removing oldest ${DELETE_COUNT}..."
                echo "${REMOTE_FILES}" | head -n "${DELETE_COUNT}" | while read -r FILE_PATH; do
                  [ -n "${FILE_PATH}" ] && curl -s -k -u "${NC_USER}:${NC_PASSWORD}" -X DELETE "${NC_URL}${FILE_PATH}"
                done
              fi
              echo "Backup maintenance finished."
            env:
            - name: NC_URL
              value: {{ .Values.vaultwarden.backup.nextcloudUrl | default "http://nextcloud.nextcloud.svc.cluster.local" | quote }}
            - name: NC_USER
              value: {{ .Values.vaultwarden.backup.nextcloudUser | default "admin" | quote }}
            {{- if .Values.vaultwarden.externalSecret.enabled }}
            - name: NC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: NC_PASSWORD
                  optional: true
            {{- end }}
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: {{ .Values.vaultwarden.app.dataPvc | default "vaultwarden-data-pvc" }}
{{- end }}
