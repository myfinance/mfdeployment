apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.paperless.app.dataPvc }}
  labels:
    app: {{ .Values.paperless.app.name }}
spec:
  storageClassName: {{ .Values.paperless.persistence.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.paperless.persistence.dataSize }}

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.paperless.app.mediaPvc }}
  labels:
    app: {{ .Values.paperless.app.name }}
spec:
  storageClassName: {{ .Values.paperless.persistence.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.paperless.persistence.mediaSize }}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.paperless.app.name }}-auth-sync
  labels:
    app: {{ .Values.paperless.app.name }}
data:
  __init__.py: ""
  apps.py: |
    import logging
    from django.apps import AppConfig
    from django.db.models.signals import m2m_changed, post_save

    logger = logging.getLogger("paperless.auth_sync")

    def setup_groups_and_permissions():
        from django.contrib.auth.models import Group, Permission
        try:
            # 1. Ensure paperless_user group exists with read + upload permissions
            user_group, _ = Group.objects.get_or_create(name="paperless_user")
            user_perm_codenames = [
                "view_document", "add_document",
                "view_correspondent", "view_documenttype", "view_tag",
                "view_storagepath", "view_savedview", "add_savedview",
                "change_savedview", "delete_savedview",
                "view_uisettings", "add_uisettings", "change_uisettings",
                "view_paperlesstask", "view_customfield", "view_customfieldinstance",
                "view_note", "add_note"
            ]
            user_perms = Permission.objects.filter(codename__in=user_perm_codenames)
            user_group.permissions.set(user_perms)

            # 2. Ensure paperless_admin group exists
            Group.objects.get_or_create(name="paperless_admin")
            logger.info("paperless_auth_sync: Groups and permissions successfully configured.")
        except Exception as e:
            logger.warning(f"paperless_auth_sync: Error initializing groups: {e}")

    def sync_user_roles(user):
        from django.contrib.auth.models import Group
        if not user or not user.pk:
            return
        if user.username in ["consumer", "AnonymousUser"]:
            return
        group_names = set(user.groups.values_list("name", flat=True))
        is_admin = "paperless_admin" in group_names

        updated = False
        if is_admin and (not user.is_superuser or not user.is_staff):
            user.is_superuser = True
            user.is_staff = True
            updated = True
        elif not is_admin and (user.is_superuser or user.is_staff) and user.username != "admin":
            user.is_superuser = False
            user.is_staff = False
            updated = True

        if not is_admin and "paperless_user" not in group_names:
            user_group = Group.objects.filter(name="paperless_user").first()
            if user_group:
                user.groups.add(user_group)

        if updated:
            user.save(update_fields=["is_superuser", "is_staff"])
            logger.info(f"paperless_auth_sync: Updated roles for user {user.username} (superuser={user.is_superuser}, staff={user.is_staff})")

    def on_groups_changed(sender, instance, action, **kwargs):
        if action in ["post_add", "post_remove", "post_clear"]:
            sync_user_roles(instance)

    def on_user_saved(sender, instance, created, **kwargs):
        sync_user_roles(instance)

    class AuthSyncConfig(AppConfig):
        name = "paperless_auth_sync"
        verbose_name = "Auth Role & Group Sync"

        def ready(self):
            from django.contrib.auth.models import User
            from allauth.account.signals import user_logged_in, user_signed_up
            from allauth.socialaccount.signals import pre_social_login

            setup_groups_and_permissions()

            m2m_changed.connect(on_groups_changed, sender=User.groups.through)
            post_save.connect(on_user_saved, sender=User)

            def handle_auth_event(sender, request, user, **kwargs):
                sync_user_roles(user)

            def handle_pre_social_login(sender, request, sociallogin, **kwargs):
                if sociallogin.is_existing:
                    return
                from allauth.socialaccount.models import SocialAccount
                username = sociallogin.user.username
                email = sociallogin.account.extra_data.get("email") or getattr(sociallogin.user, "email", None)
                existing_user = None
                if username:
                    existing_user = User.objects.filter(username=username).first()
                if not existing_user and email:
                    existing_user = User.objects.filter(email__iexact=email).first()
                if existing_user:
                    old_sa = SocialAccount.objects.filter(user=existing_user, provider=sociallogin.account.provider).first()
                    if old_sa:
                        old_sa.uid = sociallogin.account.uid
                        old_sa.extra_data = sociallogin.account.extra_data
                        old_sa.save()
                        sociallogin.account = old_sa
                    else:
                        sociallogin.connect(request, existing_user)

            pre_social_login.connect(handle_pre_social_login)
            user_logged_in.connect(handle_auth_event)
            user_signed_up.connect(handle_auth_event)

            try:
                for u in User.objects.exclude(username__in=["consumer", "AnonymousUser", "admin"]):
                    sync_user_roles(u)
            except Exception:
                pass

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.paperless.app.name }}
  labels:
    app: {{ .Values.paperless.app.name }}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.paperless.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.paperless.app.name }}
    spec:
      enableServiceLinks: false
      containers:
        - name: server
          image: {{ .Values.paperless.image }}
          env:
            - name: PAPERLESS_SECRET_KEY
              value: "{{ .Values.paperless.secretKey }}"
            - name: PAPERLESS_REDIS
              value: "redis://{{ .Values.paperless.redis.name }}:6379"
            - name: PAPERLESS_DBENGINE
              value: "postgresql"
            - name: PAPERLESS_DBHOST
              value: "{{ .Values.paperless.db.name }}"
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: "{{ .Values.paperless.db.database }}"
            - name: PAPERLESS_DBUSER
              value: "{{ .Values.paperless.db.user }}"
            - name: PAPERLESS_DBPASS
              value: "{{ .Values.paperless.db.pw }}"
            - name: PAPERLESS_URL
              value: "https://dms.hfischer.org"
            - name: PAPERLESS_ALLOWED_HOSTS
              value: "dms.hfischer.org,dms.{{ .Values.master_ip }}.nip.io,localhost,127.0.0.1,*"
            - name: PAPERLESS_CORS_ALLOWED_ORIGINS
              value: "https://dms.hfischer.org,http://dms.{{ .Values.master_ip }}.nip.io"
            - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
              value: "https://dms.hfischer.org,http://dms.{{ .Values.master_ip }}.nip.io"
            - name: PAPERLESS_ADMIN_USER
              value: "{{ .Values.paperless.admin.user }}"
            - name: PAPERLESS_ADMIN_PASSWORD
              value: "{{ .Values.paperless.admin.pw }}"
            - name: PAPERLESS_ADMIN_MAIL
              value: "{{ .Values.paperless.admin.mail }}"
            - name: PAPERLESS_APPS
              value: "allauth.socialaccount.providers.openid_connect,paperless_auth_sync"
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              value: '{"openid_connect": {"APPS": [{"provider_id": "keycloak", "name": "Keycloak", "client_id": "paperless", "secret": "{{ .Values.paperless.oauth.clientSecret }}", "settings": {"server_url": "https://keycloak.hfischer.org/realms/home/.well-known/openid-configuration"}}]}}'
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: "true"
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            - name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS
              value: "true"
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
              value: "true"
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM
              value: "groups"
            - name: PAPERLESS_REDIRECT_HEADER
              value: "HTTP_X_FORWARDED_PROTO"
            - name: PAPERLESS_TIME_ZONE
              value: "Europe/Berlin"
            - name: PAPERLESS_WEBSERVER_WORKERS
              value: "2"
          ports:
            - containerPort: 8000
              name: httpport
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: auth-sync
              mountPath: /usr/src/paperless/src/paperless_auth_sync
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.paperless.app.dataPvc }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.paperless.app.mediaPvc }}
        - name: auth-sync
          configMap:
            name: {{ .Values.paperless.app.name }}-auth-sync

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.paperless.app.name }}
  labels:
    app: {{ .Values.paperless.app.name }}
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: {{ .Values.paperless.app.name }}

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.paperless.app.name }}
  labels:
    app: {{ .Values.paperless.app.name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: "dms.{{ .Values.master_ip }}.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.paperless.app.name }}
                port:
                  number: 8000

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.paperless.app.name }}-secure
  labels:
    app: {{ .Values.paperless.app.name }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dms.hfischer.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{ .Values.paperless.app.name }}
          port: 8000
  tls:
    certResolver: default
