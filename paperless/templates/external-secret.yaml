apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: paperless-secrets
  labels:
    app: {{ .Values.paperless.app.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.paperless.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: paperless-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.paperless.externalSecret.vaultKey | default "apps/paperless" }}
        property: POSTGRES_PASSWORD
    - secretKey: PAPERLESS_DBPASS
      remoteRef:
        key: {{ .Values.paperless.externalSecret.vaultKey | default "apps/paperless" }}
        property: POSTGRES_PASSWORD
    - secretKey: PAPERLESS_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.paperless.externalSecret.vaultKey | default "apps/paperless" }}
        property: PAPERLESS_ADMIN_PASSWORD
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: {{ .Values.paperless.externalSecret.vaultKey | default "apps/paperless" }}
        property: PAPERLESS_SECRET_KEY
