{{- if and .Values.minio.enabled .Values.minio.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-creds
  labels:
    app: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.minio.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: minio-creds
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: {{ .Values.minio.externalSecret.vaultKey | default "storage/minio" }}
        property: MINIO_ROOT_USER
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.minio.externalSecret.vaultKey | default "storage/minio" }}
        property: MINIO_ROOT_PASSWORD
{{- end }}
