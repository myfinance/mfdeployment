{{- if and .Values.minio.enabled (not (and .Values.minio.externalSecret .Values.minio.externalSecret.enabled)) }}
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  labels:
    app: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.auth.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.auth.rootPassword | quote }}
{{- end }}
