{{- if .Values.dbBackup.enabled }}
{{- range $key, $target := .Values.dbBackup.targets }}
{{- if $target.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-{{ $key }}
  namespace: {{ $target.namespace }}
  labels:
    app: db-backup
    target: {{ $key }}
spec:
  schedule: {{ $target.schedule | default $.Values.dbBackup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                    - key: app
                      operator: In
                      values:
                      - {{ $target.appLabel | default $key }}
                  topologyKey: "kubernetes.io/hostname"
          containers:
          - name: db-dump
            image: {{ $.Values.dbBackup.image }}
            env:
            - name: DB_PASSWORD
              value: {{ $target.password | quote }}
            - name: DB_HOST
              value: {{ $target.host | quote }}
            - name: DB_PORT
              value: {{ $target.port | default 5432 | quote }}
            - name: DB_USER
              value: {{ $target.user | quote }}
            - name: DB_NAME
              value: {{ $target.database | quote }}
            - name: NC_URL
              value: {{ $.Values.dbBackup.nextcloud.url | default "http://nextcloud.nextcloud.svc.cluster.local" | quote }}
            - name: NC_USER
              value: {{ $.Values.dbBackup.nextcloud.user | default "admin" | quote }}
            - name: NC_PASSWORD
              value: {{ $.Values.dbBackup.nextcloud.password | quote }}
            command:
            - sh
            - -c
            - |
              set -e
              set -o pipefail
              apk add --no-cache postgresql-client curl gzip

              TARGET_DIR="{{ $target.targetDir | default "backup/immich" }}"
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              DUMP_FILE="/tmp/{{ $key }}_db_${TIMESTAMP}.sql.gz"
              
              echo "Dumping PostgreSQL database ${DB_NAME} from ${DB_HOST}:${DB_PORT} to ${DUMP_FILE}..."
              PGPASSWORD="${DB_PASSWORD}" pg_dump -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" --clean --if-exists | gzip > "${DUMP_FILE}"

              if [ ! -s "${DUMP_FILE}" ]; then
                echo "ERROR: Backup file ${DUMP_FILE} is empty or missing!"
                exit 1
              fi

              echo "Dump completed successfully. Size: $(ls -lh "${DUMP_FILE}" | awk '{print $5}')"

              echo "Ensuring Nextcloud target directory ${TARGET_DIR} exists..."
              curl -s -k -u "${NC_USER}:${NC_PASSWORD}" -X MKCOL "${NC_URL}/remote.php/dav/files/${NC_USER}/${TARGET_DIR}" || true

              echo "Uploading ${DUMP_FILE} to Nextcloud..."
              curl -s -f -k -u "${NC_USER}:${NC_PASSWORD}" -T "${DUMP_FILE}" "${NC_URL}/remote.php/dav/files/${NC_USER}/${TARGET_DIR}/{{ $key }}_db_${TIMESTAMP}.sql.gz"
              rm -f "${DUMP_FILE}"
              echo "Upload to Nextcloud completed."

              KEEP={{ $target.keepDumps | default 5 }}
              echo "Retaining the latest ${KEEP} backups in Nextcloud ${TARGET_DIR}..."

              REMOTE_FILES=$(curl -s -k -u "${NC_USER}:${NC_PASSWORD}" -X PROPFIND -H "Depth: 1" "${NC_URL}/remote.php/dav/files/${NC_USER}/${TARGET_DIR}/" | \
                grep -o '<d:href>[^<]*</d:href>' | sed 's/<[^>]*>//g' | grep '{{ $key }}_db_.*\.sql\.gz' | sort)

              TOTAL_COUNT=$(echo "${REMOTE_FILES}" | grep -c '{{ $key }}_db_' || true)
              if [ "${TOTAL_COUNT}" -gt "${KEEP}" ]; then
                DELETE_COUNT=$((TOTAL_COUNT - KEEP))
                echo "Found ${TOTAL_COUNT} backups, removing oldest ${DELETE_COUNT}..."
                echo "${REMOTE_FILES}" | head -n "${DELETE_COUNT}" | while read -r old_file; do
                  if [ -n "${old_file}" ]; then
                    echo "Deleting expired backup: ${old_file}"
                    curl -s -k -u "${NC_USER}:${NC_PASSWORD}" -X DELETE "${NC_URL}${old_file}"
                  fi
                done
              else
                echo "Current backup count (${TOTAL_COUNT}) does not exceed retention limit (${KEEP})."
              fi

              echo "Database backup of {{ $key }} to Nextcloud finished successfully."
          restartPolicy: OnFailure
{{- end }}
{{- end }}
{{- end }}
