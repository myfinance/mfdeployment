{{- if and .Values.gdrive.enabled .Values.gdrive.externalSecret.enabled }}
{{- range $key, $target := .Values.gdrive.targets }}
{{- if $target.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gdrive-rclone-config-{{ $key }}
  namespace: {{ $target.namespace }}
  labels:
    app: gdrive-sync
    target: {{ $key }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.gdrive.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: {{ $target.secretName | default $.Values.gdrive.secretName | default "gdrive-rclone-config" }}
    creationPolicy: Owner
  data:
    - secretKey: rclone.conf
      remoteRef:
        key: {{ $.Values.gdrive.externalSecret.vaultKey | default "backup/gdrive" }}
        property: rclone.conf
{{- end }}
{{- end }}
{{- end }}
