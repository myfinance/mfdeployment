{{- if and .Values.synology.enabled .Values.synology.externalSecret.enabled }}
{{- range $key, $target := .Values.synology.targets }}
{{- if $target.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: synology-rclone-config-{{ $key }}
  namespace: {{ $target.namespace }}
  labels:
    app: synology-sync
    target: {{ $key }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.synology.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: {{ $target.secretName | default $.Values.synology.secretName | default "synology-rclone-config" }}
    creationPolicy: Owner
  data:
    - secretKey: rclone.conf
      remoteRef:
        key: {{ $.Values.synology.externalSecret.vaultKey | default "backup/synology" }}
        property: rclone.conf
{{- end }}
{{- end }}
{{- end }}
