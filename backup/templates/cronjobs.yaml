{{- if .Values.backup.enabled }}
{{- range $key, $target := .Values.backup.targets }}
{{- if $target.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: usb-backup-{{ $key }}
  namespace: {{ $target.namespace }}
  labels:
    app: usb-backup
    target: {{ $key }}
spec:
  schedule: {{ $.Values.backup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: sync
            image: {{ $.Values.backup.image }}
            command:
            - sh
            - -c
            - |
              apk add --no-cache rsync
              echo "Starting sync for {{ $key }} to /usb/{{ $target.targetDir }}..."
              mkdir -p "/usb/{{ $target.targetDir }}"
              rsync -av --update {{ range $target.exclude }}--exclude={{ . | quote }} {{ end }}/source/{{ if $target.sourceSubPath }}{{ $target.sourceSubPath }}/{{ end }} "/usb/{{ $target.targetDir }}/"
              echo "Sync for {{ $key }} completed successfully."
            volumeMounts:
            - name: usb-drive
              mountPath: /usb
            - name: source-data
              mountPath: /source
              readOnly: true
          volumes:
          - name: usb-drive
            {{- if $.Values.backup.useNfs }}
            nfs:
              server: {{ $.Values.backup.nfsServer | quote }}
              path: {{ $.Values.backup.mountPath | quote }}
            {{- else }}
            hostPath:
              path: {{ $.Values.backup.mountPath }}
              type: Directory
            {{- end }}
          - name: source-data
            persistentVolumeClaim:
              claimName: {{ $target.pvc }}
          restartPolicy: OnFailure
{{- end }}
{{- end }}
{{- end }}
