{{- if and .Values.kopia.enabled .Values.kopia.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kopia-credentials
  namespace: default
  labels:
    app: kopia
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.kopia.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: kopia-credentials
    creationPolicy: Owner
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: {{ .Values.kopia.externalSecret.vaultKey | default "backup/kopia" }}
        property: KOPIA_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.kopia.externalSecret.vaultKey | default "backup/kopia" }}
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.kopia.externalSecret.vaultKey | default "backup/kopia" }}
        property: AWS_SECRET_ACCESS_KEY
{{- range $key, $target := .Values.kopia.targets }}
{{- if $target.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kopia-credentials-{{ $key }}
  namespace: {{ $target.namespace }}
  labels:
    app: kopia
    target: {{ $key }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.kopia.externalSecret.secretStoreName | default "openbao-backend" }}
    kind: ClusterSecretStore
  target:
    name: kopia-credentials
    creationPolicy: Owner
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: {{ $.Values.kopia.externalSecret.vaultKey | default "backup/kopia" }}
        property: KOPIA_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ $.Values.kopia.externalSecret.vaultKey | default "backup/kopia" }}
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ $.Values.kopia.externalSecret.vaultKey | default "backup/kopia" }}
        property: AWS_SECRET_ACCESS_KEY
{{- end }}
{{- end }}
{{- end }}
